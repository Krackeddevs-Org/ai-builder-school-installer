name: Release

# Builds installers for all three OSes on native runners.
# Triggered by pushing a tag like v0.1.0.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon
          - platform: macos-latest
            args: "--target aarch64-apple-darwin --bundles dmg,app"
            label: macOS (Apple silicon)
          # Intel Macs — same runner, different target triple
          - platform: macos-latest
            args: "--target x86_64-apple-darwin --bundles dmg,app"
            label: macOS (Intel)
          - platform: ubuntu-22.04
            args: "--bundles deb,appimage,rpm"
            label: Linux
          # The plain exe (aibs-setup_windows_x64.exe) is what students download; the NSIS
          # -setup.exe stays as the fallback because it also installs WebView2.
          - platform: windows-latest
            args: "--bundles nsis"
            label: Windows
            plain_binary: true

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.label }})

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # NOTE: libappindicator3-dev and libayatana-appindicator3-dev CONFLICT on
          # Ubuntu ("Unable to correct problems, you have held broken packages").
          # Tauri 2 wants the ayatana fork, so we install only that one.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS runners need BOTH targets so one runner can produce both DMGs.
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Rust unit tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AI Builder School Setup ${{ github.ref_name }}"
          releaseBody: |
            One-click setup for AI Builder School students.

            Installs VS Code, Git, Node.js and the Kilo Code extension, then configures
            your API key. Pick the one for your computer:

            **Windows:** `aibs-setup_windows_x64.exe` — portable, just double-click it (recommended).
            If it doesn't open, use the `-setup.exe` instead; it also installs WebView2.

            **macOS:** open Terminal and paste this (no security prompts):

            ```
            curl -fsSL https://raw.githubusercontent.com/ar-Raqmi/ai-builder-school-installer/master/scripts/install-mac.sh | bash
            ```

            The `.dmg` works too, but macOS will say it "could not verify" the app. Click Done, then
            System Settings → Privacy & Security → scroll to Security → **Open Anyway**.

            **Linux:** open a terminal and paste this:

            ```
            curl -fsSL https://raw.githubusercontent.com/ar-Raqmi/ai-builder-school-installer/master/scripts/install-linux.sh | bash
            ```

            Prefer to download it yourself? Use the `.AppImage` and ignore the `.deb` and `.rpm`.
          releaseDraft: true
          prerelease: false
          uploadPlainBinary: ${{ matrix.plain_binary || false }}
          args: ${{ matrix.args }}